name: Prune MongoDB

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually drop indexes and remove fields (otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prune-mongo
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    environment: spellstutter
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prune unused fields and indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'spellstutter' }}
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
          pnpm prune:mongo -- $ARGS
